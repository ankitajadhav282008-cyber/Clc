<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Little Webpage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #203047;
      background: linear-gradient(135deg, #e0f2fe, #f5e8ff);
    }
    main {
      width: min(100%, 520px);
      padding: 36px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(40, 55, 90, 0.14);
    }
    .emoji { font-size: 3rem; }
    h1 { margin: 12px 0; font-size: clamp(2rem, 7vw, 2.8rem); }
    p { line-height: 1.65; color: #526176; }
    button {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 999px;
      background: #6d5ce8;
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover { background: #5645d1; }
    #message { min-height: 1.6em; color: #5645d1; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <div class="emoji" aria-hidden="true">✨</div>
    <h1>Hello, world!</h1>
    <p>Welcome to my little webpage. This is a simple, colorful page you can customize with your own text and ideas.</p>
    <button id="helloButton" type="button">Click me</button>
    <p id="message" aria-live="polite"></p>
  </main>
  <script>
    document.getElementById("helloButton").addEventListener("click", function () {
      document.getElementById("message").textContent = "Thanks for visiting! Have a wonderful day. 🌷";
    });
  </script>
</body>
</html>
